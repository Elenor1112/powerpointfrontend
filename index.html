<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Elenor Presentation Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #121826;
    --teal: #5ac8d8;
    --text: #eef3f5;
    --dim: #9aa8b3;
    --error: #e0685f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, #0f2430 60%, #1c4a55 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: rgba(18, 24, 38, 0.75);
    border: 1px solid rgba(90, 200, 216, 0.25);
    border-radius: 12px;
    padding: 32px;
    backdrop-filter: blur(6px);
  }
  h1 {
    font-size: 24px;
    margin: 0 0 24px;
    font-weight: bold;
  }
  .step {
    margin-bottom: 24px;
  }
  .step-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--teal);
    margin-bottom: 8px;
    font-weight: bold;
  }
  .template-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .template-name { font-size: 14px; }
  .status-badge {
    font-size: 12px;
    color: var(--teal);
  }
  input[type="file"] { display: none; }
  .link-btn {
    background: none;
    border: none;
    color: var(--teal);
    text-decoration: underline;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--text);
    padding: 14px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea::placeholder { color: var(--dim); }
  button.primary {
    width: 100%;
    padding: 14px;
    background: var(--teal);
    color: #062024;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status-line {
    margin-top: 16px;
    font-size: 14px;
    min-height: 20px;
  }
  .status-line.error { color: var(--error); }
  .status-line.success { color: var(--teal); }
  .download-row {
    margin-top: 12px;
  }
  a.download-btn {
    display: inline-block;
    padding: 10px 18px;
    background: transparent;
    border: 1px solid var(--teal);
    color: var(--teal);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>Elenor Presentation Generator</h1>

    <div class="step">
      <div class="step-label">1. Template</div>
      <div class="template-row">
        <div>
          <div class="template-name" id="templateName">Loading…</div>
          <div class="status-badge" id="templateStatus"></div>
        </div>
        <label class="link-btn" for="templateFile">Replace template</label>
        <input type="file" id="templateFile" accept=".pptx" />
      </div>
    </div>

    <div class="step">
      <div class="step-label">2. Presentation Content</div>
      <textarea id="contentInput" placeholder="Paste your presentation content here...

Example:

Company:
ABC Company

Project:
Website redesign

Goals:
Increase conversions
Improve brand perception

Results:
35% increase in conversions
50% faster page load"></textarea>
    </div>

    <div class="step">
      <div class="step-label">3. Generate</div>
      <button class="primary" id="generateBtn">Generate Presentation</button>
      <div class="status-line" id="statusLine"></div>
      <div class="download-row" id="downloadRow" style="display:none;">
        <a class="download-btn" id="downloadLink" href="#">Download PPTX</a>
      </div>
    </div>
  </div>

<script>
const API_BASE = "https://power-point-generator-production.up.railway.app";

const templateName = document.getElementById("templateName");
const templateStatus = document.getElementById("templateStatus");
const templateFile = document.getElementById("templateFile");
const contentInput = document.getElementById("contentInput");
const generateBtn = document.getElementById("generateBtn");
const statusLine = document.getElementById("statusLine");
const downloadRow = document.getElementById("downloadRow");
const downloadLink = document.getElementById("downloadLink");

async function loadTemplateInfo() {
  try {
    const res = await fetch(`${API_BASE}/api/template`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      templateName.textContent = "No template loaded";
      templateStatus.textContent = err.detail || "Missing template.";
      templateStatus.style.color = "#e0685f";
      return;
    }
    const data = await res.json();
    templateName.textContent = data.filename;
    templateStatus.textContent = `Template loaded — ${data.slide_count} slides`;
    templateStatus.style.color = "";
  } catch (e) {
    templateName.textContent = "Unable to reach server";
    templateStatus.textContent = String(e);
    templateStatus.style.color = "#e0685f";
  }
}

templateFile.addEventListener("change", async () => {
  const file = templateFile.files[0];
  if (!file) return;
  templateStatus.textContent = "Uploading…";
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch(`${API_BASE}/api/template`, { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      templateStatus.textContent = data.detail || "Unable to process the template.";
      templateStatus.style.color = "#e0685f";
      return;
    }
    templateName.textContent = data.filename;
    templateStatus.textContent = `Template loaded — ${data.slide_count} slides`;
    templateStatus.style.color = "";
  } catch (e) {
    templateStatus.textContent = "Upload failed.";
    templateStatus.style.color = "#e0685f";
  }
});

generateBtn.addEventListener("click", async () => {
  const text = contentInput.value.trim();
  downloadRow.style.display = "none";

  if (!text) {
    statusLine.textContent = "Please enter presentation content.";
    statusLine.className = "status-line error";
    return;
  }

  generateBtn.disabled = true;
  statusLine.innerHTML = '<span class="spinner"></span>Generating presentation…';
  statusLine.className = "status-line";

  try {
    const form = new FormData();
    form.append("content_text", text);
    const res = await fetch(`${API_BASE}/api/generate`, { method: "POST", body: form });
    const data = await res.json();

    if (!res.ok) {
      statusLine.textContent = data.detail || "Something went wrong.";
      statusLine.className = "status-line error";
      return;
    }

    statusLine.textContent = "Presentation generated successfully.";
    statusLine.className = "status-line success";
    downloadLink.href = `${API_BASE}${data.download_url}`;
    downloadRow.style.display = "block";
  } catch (e) {
    statusLine.textContent = "Unable to reach the server.";
    statusLine.className = "status-line error";
  } finally {
    generateBtn.disabled = false;
  }
});

loadTemplateInfo();
</script>
</body>
</html>
